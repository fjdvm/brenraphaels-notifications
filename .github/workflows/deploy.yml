name: CI and container smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:54329/postgres
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '18088'
      SMTP_USER: smoke
      SMTP_PASSWORD: smoke
      APP_EMAIL_SENDER: apps@example.com
      MARKETING_EMAIL_SENDER: marketing@example.com
      API_TOKEN: smoke-token-0123456789
      GATEWAY_SECRET: smoke-gateway-0123456789
      PORT: '18087'
      SMOKE_URL: http://127.0.0.1:18087
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate disposable database
        run: npm run db:migrate
      - name: Build Node image
        run: docker build -t notifications:smoke .
      - name: Start image
        run: |
          docker run -d --name notifications-smoke --network host \
            -e DATABASE_URL -e SMTP_HOST -e SMTP_PORT -e SMTP_USER -e SMTP_PASSWORD \
            -e APP_EMAIL_SENDER -e MARKETING_EMAIL_SENDER -e API_TOKEN -e GATEWAY_SECRET \
            -e PORT notifications:smoke
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SMOKE_URL/health"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Exercise container HTTP interface
        run: npm run smoke
      - name: Exercise container WebSocket interface and restart
        run: npm run smoke:live
        env:
          SMOKE_CONTAINER: notifications-smoke
      - name: Exercise container Email retries and restart
        run: npm run smoke:email
        env:
          SMOKE_CONTAINER: notifications-smoke
      - name: Container logs
        if: always()
        run: docker logs notifications-smoke
      - name: Stop container
        if: always()
        run: docker rm -f notifications-smoke

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: azure-deploy
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/fjdvm/brenraphaels-notifications:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/fjdvm/brenraphaels-notifications:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Container App (1 replica)
        id: deploy
        run: ./scripts/azure-deploy.sh
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          APP_EMAIL_SENDER: ${{ vars.APP_EMAIL_SENDER }}
          APP_EMAIL_SENDER_NAME: ${{ vars.APP_EMAIL_SENDER_NAME }}
          MARKETING_EMAIL_SENDER: ${{ vars.MARKETING_EMAIL_SENDER }}
          MARKETING_EMAIL_SENDER_NAME: ${{ vars.MARKETING_EMAIL_SENDER_NAME }}
      - name: Verify deployed health and replicas
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "https://${{ steps.deploy.outputs.fqdn }}/health"; then break; fi
            [ "$attempt" = 30 ] && exit 1
            sleep 5
          done
          counts=$(az containerapp show -n notifications -g rg-brenraphaels \
            --query "[properties.template.scale.minReplicas, properties.template.scale.maxReplicas]" -o tsv | tr '\n' ' ')
          echo "replicas min/max: $counts"
          test "$counts" = "1 1 "
